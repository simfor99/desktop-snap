[package]
name = "desktop-snap"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "WGC-only Windows screenshot CLI for WSL2 with built-in privacy guardrails"
license = "MIT"
repository = "https://github.com/simfor99/desktop-snap"
publish = false

[dependencies]
serde_json = "=1.0.151"
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation_Metadata",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "=0.1.31"
sha2 = "=0.10.9"

[profile.release]
opt-level = 2
